[project]
name = "agentops-backend"
version = "0.1.0"
description = "AgentOps Center - AI Agent Operations & Evaluation Center (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "real_agent: invokes a real external agent CLI (consumes tokens); run with -m real_agent",
]
addopts = "-m 'not real_agent'"
