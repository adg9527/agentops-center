# Optional infrastructure for running on PostgreSQL instead of the default SQLite.
# The backend itself runs on the host (it must launch host-installed agent CLIs such as claude / opencode).
#
#   docker compose up -d postgres
#   set AGENTOPS_DATABASE_URL=postgresql+asyncpg://agentops:agentops@127.0.0.1:55432/agentops
#
# Uses a dedicated, named volume and a non-default host port so it can't collide with existing containers.
# NOT yet verified in this environment (Docker Desktop was not running during phase 1).
services:
  postgres:
    image: postgres:16
    container_name: agentops-postgres
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops   # local-only dev credential; change for any shared deployment
      POSTGRES_DB: agentops
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - agentops_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: agentops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: agentops
      RABBITMQ_DEFAULT_PASS: agentops   # local-only dev credential
    ports:
      - "127.0.0.1:5672:5672"    # AMQP
      - "127.0.0.1:15672:15672"  # 管理界面 http://127.0.0.1:15672
    volumes:
      - agentops_rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  agentops_pgdata:
    name: agentops_pgdata
  agentops_rabbitmq:
    name: agentops_rabbitmq
